[workspace]
members = ["crates/cards", "crates/ranges", "crates/tree", "crates/cfr", "crates/solver", "crates/sizing", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cards = { path = "crates/cards" }
ranges = { path = "crates/ranges" }
tree = { path = "crates/tree" }
cfr = { path = "crates/cfr" }
solver = { path = "crates/solver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = 1
